name = "classroom-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# All-in-one deployment: this Worker serves the built frontend (../web/dist)
# AND the WebSocket relay. `npx wrangler deploy` ships both in one step.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/ws", "/healthz"]

# Hub state lives in a Durable Object using the WebSocket Hibernation API:
# idle sockets cost (almost) nothing; SQLite-backed classes run on free plan.
[[durable_objects.bindings]]
name = "HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]
